# Capture-mode checks on every pull request: unit tests, the fidelity diff over the golden captures, the redaction lint
# over profiles/ and the golden captures, and the generated matrices (which must be what is committed).
#
# Read-only by design: it checks out, builds, tests and uploads artifacts. It has no deploy or publish step, no
# credentials, and nothing here pushes (to git or anywhere else).
name: capture-checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: capture-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The Android platform the build compiles against (compileSdk in gradle/libs.versions.toml). The runner image may
      # already have it; if so this does nothing. Unverified on a hosted runner: adjust if the image changes.
      - name: Android SDK platform
        run: |
          set -eu
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" > /dev/null

      - name: Tests of the CI scripts
        run: python3 -I -m unittest discover -s tools/tests -p 'test_check_test_results.py'

      - name: Redaction lint over profiles/ and the golden captures
        run: ./gradlew :composeApp:testDebugUnitTest --tests '*ProfilesRedactionLintTest*' --tests '*RedactionLintTest*'

      # A deviation fails the test with the diff table in its message
      - name: Fidelity diff and hold-out over the golden captures
        run: ./gradlew :composeApp:testDebugUnitTest --tests '*GoldenCaptureDiffTest*' --tests '*MeasuredProfileGoldenFileTest*'

      - name: Unit tests (only the known-failing tests in .github/known-failing-tests.txt may fail)
        shell: bash
        run: |
          set +e
          ./gradlew :composeApp:testDebugUnitTest --continue
          gradle_status=$?
          set -e
          python3 -I tools/ci/check_test_results.py \
            --results composeApp/build/test-results/testDebugUnitTest \
            --allowlist .github/known-failing-tests.txt \
            --gradle-exit "$gradle_status" \
            --min-tests 600

      - name: Regenerate the matrices
        run: |
          UPDATE_GENERATED_DOCS=1 ./gradlew :composeApp:testDebugUnitTest \
            --tests '*CoverageMatrixTest*' --tests '*ChipProfileEvidenceDocTest*' --tests '*ReaderCompatibilityTest*'

      - name: The committed generated docs are what the profiles render to
        run: |
          git diff --exit-code -- \
            docs/coverage-matrix.md docs/coverage-matrix.json \
            docs/chip-profile-evidence.measured.md docs/reader-compatibility.md

      - name: Upload the matrices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-matrices
          if-no-files-found: warn
          path: |
            docs/coverage-matrix.md
            docs/coverage-matrix.json
            docs/chip-profile-evidence.measured.md
            docs/reader-compatibility.md
            docs/reader-compatibility.json
